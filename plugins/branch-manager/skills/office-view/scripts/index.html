<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#2b2d3a">
<title>Office View</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#23252f; --card:#fffdf6; --muted:#6b6e7e; --gold:#f5c518;
  --making:#2f7fd1; --reading:#8a6bd6; --talking:#e0794a; --shipping:#2f9e6b;
  --working:#3cc47c; --idle:#f0a92e; --away:#b9ada0; --asleep:#7f8fb5;
  --ch:64px; --cw:49px; --fb:13px; --fh:15px;
  --pix:-apple-system,"SF Pro Rounded","SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif; --tiny:"Silkscreen",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#2b2d3a;overflow:hidden;overscroll-behavior:none}
body{color:var(--ink);font:12px/1.3 var(--pix);-webkit-user-select:none;user-select:none}
#probe{position:fixed;top:0;padding-top:env(safe-area-inset-top);visibility:hidden}
#office{position:fixed;left:0;top:0;transform-origin:0 0;overflow:hidden;background:#2b2d3a}
#office.tv{--fb:24px;--fh:30px}
svg.layer{position:absolute;left:0;top:0;overflow:visible;shape-rendering:crispEdges;pointer-events:none}
#light{z-index:2;pointer-events:none} #map{z-index:1;filter:saturate(.86)} #fronts{z-index:6;filter:saturate(.9)} .person svg{filter:saturate(1.08)} #paths{z-index:9;shape-rendering:auto}
.person{position:absolute;left:0;top:0;width:var(--cw);height:var(--ch);margin:calc(var(--ch)*-1) 0 0 calc(var(--cw)*-.5);z-index:4;transition:transform 1.7s linear,opacity .6s;cursor:pointer}
.person.off{opacity:0;pointer-events:none}
.person.moving{z-index:12}.person.visiting,.person.standing{z-index:8}
.person .body{width:100%;height:100%;transition:transform .2s}
.person.left .body{transform:scaleX(-1)}
.person.small .body{transform:scale(.76);transform-origin:50% 100%}.person.small.left .body{transform:scale(-.76,.76)}
#office.tv .person.small .body{transform:scale(.64)}#office.tv .person.small.left .body{transform:scale(-.64,.64)}#office.tv .person.small .tag{top:calc(var(--ch)*.16)}
.person.small .tag{top:calc(var(--ch)*.04);font-size:max(9px,calc(var(--ch)*.15))}
.person .tag{position:absolute;left:50%;top:calc(var(--ch)*-.2);transform:translateX(-50%);white-space:nowrap;font:700 max(10px,calc(var(--ch)*.17))/1.15 var(--pix);color:#fff;background:rgba(36,27,58,.82);border:1.5px solid rgba(255,255,255,.55);border-radius:6px;padding:1px 5px;pointer-events:none;letter-spacing:.2px}
.person.moving .tag{opacity:.85}
.person svg{width:100%;height:100%;overflow:visible;shape-rendering:crispEdges}
.person .ring{position:absolute;left:50%;bottom:-6%;width:120%;height:22%;transform:translateX(-50%);border:3px solid var(--gold);border-radius:50%;opacity:0;z-index:-1}
.person.moving .ring{opacity:1}
.person.target .ring{opacity:1;animation:ring .7s ease-in-out infinite}
@keyframes ring{50%{transform:translateX(-50%) scale(1.15);opacity:.5}}
.person.moving .legL{animation:stepA .34s steps(1) infinite}.person.moving .legR{animation:stepB .34s steps(1) infinite}
@keyframes stepA{0%{transform:translateY(0)}50%{transform:translateY(-1.2px)}}@keyframes stepB{0%{transform:translateY(-1.2px)}50%{transform:translateY(0)}}
.armsType,.armsUp,.paper,.phone{display:none}
.pose-type .armsDown,.pose-read .armsDown,.pose-cheer .armsDown,.pose-phone .armR{display:none}
.pose-type .armsType,.pose-read .armsType,.pose-read .paper,.pose-cheer .armsUp,.pose-phone .phone{display:inline}
.pose-type .armsType{animation:type .28s steps(1) infinite}
@keyframes type{50%{transform:translateY(-.6px)}}
.pose-cheer .bob{animation:cheer .5s steps(2) infinite}@keyframes cheer{50%{transform:translateY(-1.5px)}}
.pose-sleep .head{transform:translate(0,2px) rotate(9deg);transform-origin:10px 11px}
.pose-sleep .bob{animation:breathe 3s ease-in-out infinite}@keyframes breathe{50%{transform:translateY(.6px)}}
.person.pulse .bob{animation:bob .4s steps(2) 2}@keyframes bob{50%{transform:translateY(-1px)}}
.ib{position:absolute;left:0;top:0;z-index:25;width:calc(var(--ch)*.4);height:calc(var(--ch)*.4);background:#fff;border:2px solid var(--ink);border-radius:50%;display:flex;align-items:center;justify-content:center;font:700 calc(var(--ch)*.22)/1 var(--tiny);opacity:0;transition:opacity .4s;pointer-events:none;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.ib.show{opacity:1}
.ib:after{content:"";position:absolute;left:18%;bottom:-7px;width:9px;height:9px;background:#fff;border-right:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:rotate(45deg)}
.ib.txt{font-size:calc(var(--ch)*.13);color:#3b4a6b}
.ib.big{width:calc(var(--ch)*.52);height:calc(var(--ch)*.52)}
.react{position:absolute;left:50%;top:-30%;transform:translateX(-50%);font-size:calc(var(--ch)*.3);animation:pop .35s ease-out;z-index:3}
.carry{position:absolute;left:60%;top:45%;font-size:calc(var(--ch)*.28)}
@keyframes pop{0%{transform:translateX(-50%) scale(.2)}70%{transform:translateX(-50%) scale(1.25)}100%{transform:translateX(-50%) scale(1)}}
.bubble{position:absolute;left:0;top:0;z-index:30;width:max-content;max-width:calc(var(--fb)*11);background:var(--card);border:2px solid var(--ink);border-radius:10px;padding:.2em .5em;font:600 calc(var(--fb)*.85)/1.2 var(--pix);box-shadow:0 3px 0 rgba(0,0,0,.25);pointer-events:none;opacity:0;transition:opacity .3s}
.bubble.show{opacity:1}
.bubble:after{content:"";position:absolute;left:var(--tail,50%);bottom:-5px;width:7px;height:7px;background:var(--card);border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:translateX(-50%) rotate(45deg)}
.pop{position:absolute;z-index:28;font-size:calc(var(--ch)*.28);pointer-events:none;animation:rise 1.6s ease-out forwards}
@keyframes rise{0%{transform:translate(-50%,0) scale(.4);opacity:0}20%{opacity:1;transform:translate(-50%,-6px) scale(1.1)}100%{transform:translate(-50%,calc(var(--ch)*-.6)) scale(.9);opacity:0}}
.hl{position:absolute;z-index:7;border:3px dashed var(--gold);border-radius:8px;pointer-events:none;opacity:0;transition:opacity .4s}
.hl.on{opacity:1;animation:hl .8s ease-in-out infinite}@keyframes hl{50%{box-shadow:0 0 14px var(--gold)}}
.badge{position:absolute;z-index:26;background:#23252f;color:#fff;border-radius:8px;padding:.15em .5em;font:700 var(--fb) var(--pix);transform:translateX(-50%);pointer-events:none;white-space:nowrap}
.zlabel{position:absolute;z-index:2;font:800 calc(var(--fb)*.78) var(--pix);color:#5a4b2e;letter-spacing:.2px;background:rgba(246,234,208,.85);padding:1px 4px;border-radius:3px;letter-spacing:.5px;white-space:nowrap}
#tint{position:absolute;inset:0;z-index:20;pointer-events:none;background:#16224a;mix-blend-mode:multiply;opacity:0;transition:opacity 4s,background 4s}
.pool{position:absolute;z-index:21;pointer-events:none;border-radius:50%;mix-blend-mode:screen;opacity:0;transition:opacity 1.2s}
.pool.lamp{z-index:3;filter:blur(calc(var(--ch)*.12))}
.person .shadow{transform:translateX(var(--sdx,0px)) scaleX(1.25);transform-box:fill-box;transform-origin:center}
#office.golden .person svg{filter:saturate(1.2) sepia(.08)}
#head{position:absolute;left:0;right:0;top:0;z-index:40;padding:6px 10px 5px;background:#2b2d3a;color:#f3ead2;cursor:pointer;border-bottom:3px solid #1c1d26}
#head .h1{font:700 var(--fh)/1.2 var(--pix);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#head .h2{font:500 calc(var(--fh)*.8)/1.3 var(--pix);color:#d4cdb9;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.teambtn{position:absolute;right:8px;bottom:8px;z-index:41;background:#23252f;color:#f6ead0;border-radius:999px;padding:.35em .8em;font:700 var(--fb) var(--pix);box-shadow:0 3px 0 rgba(0,0,0,.3);cursor:pointer}
.pile{position:absolute;z-index:7;cursor:pointer;display:none}
.pile .sh{position:absolute;left:0;background:#f7f4ea;border:1px solid #b9b2a0;border-radius:1px}
.pile .tray{position:absolute;left:-8%;width:116%;bottom:0;background:#c99a10;border-bottom:2px solid #8a6a08}
.pile .n{position:absolute;right:-30%;min-width:1.5em;height:1.5em;border-radius:1em;background:#d8000c;color:#fff;font:700 max(10px,calc(var(--ch)*.18))/1.5em var(--pix);text-align:center;padding:0 .35em;border:2px solid #fff;box-shadow:0 2px 0 rgba(0,0,0,.25)}
.pile.fresh .n{animation:pilepop .9s ease 2}
@keyframes pilepop{50%{transform:scale(1.35)}}
#pileSheet{position:fixed;inset:0;z-index:70;background:rgba(20,21,28,.88);display:none;align-items:center;justify-content:center;padding:20px}
#pileSheet.open{display:flex}
#pileSheet .card{background:#fffdf6;color:#23252f;border-radius:14px;max-width:520px;width:100%;padding:16px 18px;font:500 var(--fb)/1.35 var(--pix);box-shadow:0 8px 0 rgba(0,0,0,.3)}
#pileSheet h3{margin:0 0 8px;font:700 var(--fh)/1.2 var(--pix)}
#pileSheet ol{margin:0;padding-left:1.3em}#pileSheet li{margin:.35em 0}
#pileSheet .w{margin-top:10px;color:#6b6457;font-size:.9em}
#team{position:fixed;inset:0;z-index:70;background:rgba(20,21,28,.88);display:none;align-items:center;justify-content:center;padding:20px}
#team.open{display:flex}
#team .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:14px 8px;width:100%;max-width:720px}
#team .chip .face{width:56px;height:56px}
#team .chip .st{font:500 11px var(--pix);color:#a9a293}
.chip{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:8px;cursor:pointer;min-width:0}
.chip .face{border-radius:50%;background:#3a3d4e;border:3px solid var(--away);overflow:hidden;display:flex;align-items:flex-start;justify-content:center}
.chip .face svg{shape-rendering:crispEdges}
.chip .nm{font:700 13px/1.15 var(--pix);color:#ece5d2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;margin-top:2px}
.chip.onstage .nm{color:var(--gold)}
.chip.asleep{opacity:.55}
.chip .cp{position:absolute;top:-4px;right:2px;font-size:calc(var(--fb)*1.1);animation:pop .35s ease-out}
#ticker{position:absolute;z-index:40;display:flex;gap:10px}
.tk{flex:1;min-width:0;background:#fffdf6;border:3px solid #23252f;border-radius:10px;padding:.3em .6em;font:500 var(--fb)/1.25 var(--pix);box-shadow:0 3px 0 rgba(0,0,0,.3)}
.tk .who{font-weight:700}.tk .ago{color:var(--muted);float:right;margin-left:.5em}
.tk .txt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#replay{position:absolute;z-index:45;left:50%;transform:translateX(-50%);background:#23252f;color:#fff;border-radius:6px;padding:.3em .9em;font:600 var(--fb) var(--pix);opacity:0;transition:opacity .4s;pointer-events:none;white-space:nowrap}
.confetti{position:absolute;z-index:35;width:7px;height:9px;pointer-events:none;animation:fall 1.8s ease-out forwards}
@keyframes fall{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(540deg);opacity:0}}
.screen{background:#16181b;color:#cfe9d7;border-radius:10px;font:12px/1.45 ui-monospace,Menlo,monospace;padding:10px 12px;overflow:auto}
.screen .ln{white-space:pre-wrap;word-break:break-word;padding:2px 0;border-bottom:1px solid #24272b}
.screen .ln .t{color:#6f7a83}.screen .ln .c{font-weight:700}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:70%;display:flex;flex-direction:column;background:var(--card);border-top:3px solid #23252f;border-radius:16px 16px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(0,0,0,.35);transform:translateY(105%);transition:transform .3s;z-index:60;-webkit-user-select:text;user-select:text;font-family:var(--pix)}
#sheet.open{transform:none}
#sheet h2{margin:0 0 2px;font-size:17px}
#sheet .meta{color:var(--muted);font-size:13px;margin-bottom:8px}
#sheet .screen{flex:1;min-height:120px}
</style>
</head>
<body>
<div id="probe"></div>
<svg width="0" height="0" style="position:absolute"><defs><filter id="spriteOL" x="-20%" y="-20%" width="140%" height="140%"><feMorphology in="SourceAlpha" operator="dilate" radius=".55" result="d"/><feFlood flood-color="#241b3a"/><feComposite in2="d" operator="in" result="o"/><feMerge><feMergeNode in="o"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs></svg>
<div id="office"></div>
<div id="sheet"></div>
<script>
const CATHEX={making:'#2f7fd1',reading:'#8a6bd6',talking:'#e0794a',shipping:'#2f9e6b'};
const ICON={typing:'⌨️',reading:'📄',terminal:'💻',github:'🔀',browsing:'🌐',saying:'💬',wrapup:'✅',delegating:'🧑‍💻',working:'⚙️',talking:'✉️',hiring:'🤝',presenting:'🖨️'};
const office=document.getElementById('office'), sheet=document.getElementById('sheet');
const q=new URLSearchParams(location.search);
let MODE,W,H,S,L; const P={}; let ST=null, first=true, selected=null;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const pick=a=>a[Math.random()*a.length|0];
const px=v=>v+'px';
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function clip(s,n){s=String(s||'');return s.length>n?s.slice(0,n-1)+'…':s}
function ago(t){const s=Math.max(0,(Date.now()-t)/1000|0);return s<60?s+'s':s<3600?(s/60|0)+'m':(s/3600|0)+'h'}
function hash(s){let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))>>>0;return h}
function el(cls,css={},parent=office,html=''){const d=document.createElement('div');d.className=cls;Object.assign(d.style,css);d.innerHTML=html;parent.appendChild(d);return d}
const r=(x,y,w,h,f,ex='')=>`<rect x="${+x.toFixed(2)}" y="${+y.toFixed(2)}" width="${+Math.max(0,w).toFixed(2)}" height="${+Math.max(0,h).toFixed(2)}" fill="${f}" ${ex}/>`;
const tx=(x,y,t,s,f,ex='')=>`<text x="${x}" y="${y}" font-family="Silkscreen,monospace" font-size="${s}" fill="${f}" text-anchor="middle" font-weight="700" ${ex}>${esc(t)}</text>`;

// ---------- palette: brighter, warmer ----------
const C={wall:'#f6ead0',wallBase:'#d8c296',wallTop:'#5d6075',div:'#5d6075',wood:'#b77d50',woodDark:'#8e5c37',woodEdge:'#6a4226',
  chair:'#3e4356',chairHi:'#555b73',metal:'#a4aab4',paper:'#f7f4ea',leaf:'#3f9a46',leaf2:'#6cc067',pot:'#c2703f',potDark:'#9a5530',navy:'#22407a',sky:'#9fd0f2',
  carpet:'#7186b8',carpetLine:'#677cae',lino:'#f3ead6',linoLine:'#bfdcc9',plank:'#c99a68',plankLine:'#b88a5a',rug:'#d9a35f',rug2:'#c98f4c',monBack:'#3a3d4c'};
const plant=(x,y)=>r(x-3.5,y,7,6,C.pot)+r(x-3.5,y+4.5,7,1.5,C.potDark)+r(x-5.5,y-5,4,4,C.leaf)+r(x+1.5,y-5,4,4,C.leaf)+r(x-2,y-8.5,4,6,C.leaf2)+r(x-6.5,y-2.5,5,3,C.leaf2)+r(x+1.5,y-2.5,5,3,C.leaf);
const frame=(x,y,w,h)=>r(x,y,w,h,'#6b4a2b')+r(x+1,y+1,w-2,h-2,'#a8d0ef')+r(x+1,y+h*.6,w-2,h*.4-1,'#6fae5b')+r(x+w*.55,y+h*.25,w*.2,h*.2,'#fff3a8');
const wallBand=()=>r(0,0,100,22,C.wall)+r(0,20,100,2.2,C.wallBase)+r(0,0,100,1.3,C.wallTop);
const pendant=(x,y,c='#2b2d3a')=>r(x-.3,0,.6,y-3,'#3a3d4c')+`<path d="M${x-2} ${y-3.2} L${x+2} ${y-3.2} L${x+5} ${y} L${x-5} ${y}Z" fill="${c}"/>`+r(x-4.2,y-.2,8.4,.9,'#ffe6a8');
const floorLamp=(x,y,h)=>`<path d="M${x-4} ${y} L${x+4} ${y} L${x+3} ${y-6} L${x-3} ${y-6}Z" fill="#f1e3c0"/>`+r(x-4,y-.4,8,.8,'#ffd08a')+r(x-.5,y,1,h,'#2b2d3a')+r(x-3,y+h,6,1.4,'#2b2d3a');
const deskLamp=(x,y)=>r(x-3,y+5,6,1.2,'#c99a10')+r(x-.4,y+1,.8,4,'#c99a10')+`<path d="M${x-4} ${y+1.4} Q${x} ${y-3.2} ${x+4} ${y+1.4}Z" fill="#2f8f5a"/>`+r(x-4,y+1,8,.8,'#ffe6a8');
const chairBack=(x,y)=>r(x,y,13,15,C.chair)+r(x,y,13,2,C.chairHi);
const monBack=(x,y,g)=>`<rect class="glow" data-g="${g}" x="${x-3}" y="${y-3}" width="20" height="18" rx="4" fill="#9fe3b4" opacity="0"/>`+r(x,y,14,11,C.monBack)+r(x+5.5,y+11,3,2,C.monBack)+r(x+1,y+1,12,1,'#4a4e60');
const deskFront=(x,y,w,plate)=>r(x,y,w,4,C.wood)+r(x,y+4,w,14,C.woodDark)+r(x,y+17,w,1.2,C.woodEdge)+r(x+2,y+5.5,w-4,.8,'#a06a42')+(plate?r(x+w/2-11,y+8,22,5.5,'#efe0b0')+r(x+w/2-11,y+8,22,5.5,'none','stroke="#8a6a3c" stroke-width=".5"')+tx(x+w/2,y+12.4,plate,4.2,'#3a2a14'):'');

// a window onto the outside: sky, sun/moon, stars, a little skyline whose windows light up at night
const WINS=[];
function win(x,y,w,h,s=0){WINS.push({x,w}); const W2=w-2,H2=h-2; let g=`<rect class="sky" x="0" y="0" width="${W2}" height="${H2}" fill="${C.sky}"/>`;
  for(let i=0;i<6;i++) g+=`<rect class="star" x="${((i*7.3+s*3.1)%(W2-1)).toFixed(1)}" y="${(.8+((i*5+s)%5)*.9).toFixed(1)}" width=".5" height=".5" fill="#fff" opacity="0"/>`;
  g+=`<circle class="sun" data-w="${W2}" data-h="${H2}" cx="${W2*.7}" cy="${H2*.3}" r="${Math.min(2.2,H2*.17).toFixed(2)}" fill="#fff3b0"/>`;
  g+=`<circle class="moon" cx="${(W2*(.25+(s%3)*.2)).toFixed(1)}" cy="${(H2*.28).toFixed(1)}" r="1.5" fill="#f4f1de" opacity="0"/>`;
  let bx=-.5,i=0; while(bx<W2){const bw=3+((s+i)*7%4), bh=H2*(.22+((s*3+i*5)%5)*.07);
    g+=`<rect class="bld" x="${bx.toFixed(1)}" y="${(H2-bh).toFixed(1)}" width="${bw}" height="${bh.toFixed(1)}" fill="#8a9ab8"/>`;
    let j=0; for(let wy=H2-bh+.9;wy<H2-1.6;wy+=1.7) for(let wx=bx+.6;wx<bx+bw-.9;wx+=1.4){ if((j++*5+i*3+s)%3!==1) g+=`<rect class="lit" x="${wx.toFixed(1)}" y="${wy.toFixed(1)}" width=".7" height=".8" fill="#ffd36b" opacity="0"/>`}
    bx+=bw+.5; i++;}
  g+=`<path class="hill" d="M0 ${H2} L0 ${(H2-1.2).toFixed(1)} Q${(W2*.3).toFixed(1)} ${(H2-2.6).toFixed(1)} ${(W2*.6).toFixed(1)} ${(H2-1.1).toFixed(1)} T${W2} ${(H2-1.7).toFixed(1)} L${W2} ${H2}Z" fill="#5f9a5a"/>`;
  return r(x,y,w,h,'#6d6f80')+`<svg x="${x+1}" y="${y+1}" width="${W2}" height="${H2}" viewBox="0 0 ${W2} ${H2}" overflow="hidden">${g}</svg>`+r(x+w/2-.3,y+1,.6,H2,'#e8e4da')+r(x+1,y+h*.45,W2,.5,'#e8e4da')+r(x-.6,y+h-.4,w+1.2,1.4,'#cfc8b8');}
// ---------- zones: each drawn 100 units wide, hz units tall ----------
const ZONES={

// colour ramps (Kelly 4 art direction): shade = toward blue & darker, highlight = toward yellow & lighter
function hx(c){c=c.replace('#','');if(c.length===3)c=c.split('').map(x=>x+x).join('');return[0,2,4].map(i=>parseInt(c.substr(i,2),16))}
function toHex(a){return'#'+a.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('')}
function mix(c1,c2,t){const a=hx(c1),b=hx(c2);return toHex(a.map((v,i)=>v+(b[i]-v)*t))}
const shadeOf=c=>mix(mix(c,'#2b2f6b',.12),'#000',.18), hiOf=c=>mix(mix(c,'#fff3c4',.18),'#fff',.1);

function lookFor(p){
  const n=p.name.toLowerCase(); if(LOOK[n]) return LOOK[n];
  const first=n.replace(/\s*\d+$/,'').split(' ')[0]; if(LOOK[first]) return LOOK[first];
  const h=hash(p.name); return {skin:SKIN[(h>>>4)%SKIN.length],hair:HAIR[(h>>>8)%HAIR.length],style:['short','long','messy','crop'][(h>>>16)%4],shirt:SHIRTS[h%SHIRTS.length]};
}

    curly:R(4,0,12,3.6,hair)+R(3.2,1.4,2,6.6,hair)+R(14.8,1.4,2,6.6,hair)+R(5,-.6,2,1,hair)+R(9,-.8,2,1,hair)+R(13,-.6,2,1,hair),

  if(L0.mustache) head+=R(7.4,8.3,5.2,1,L0.mustache);

  const aL=bx-1.4, aR=bx+bw-.4;

// ---------- layout ----------
let ZL={};
function computeLayout(){
  MODE=(q.get('tv')==='1'||(q.get('tv')!=='0'&&innerWidth>innerHeight*1.15))?'tv':'phone';
  W=MODE==='tv'?1600:400; S=innerWidth/W; H=innerHeight/S;
  const safe=(parseFloat(getComputedStyle(document.getElementById('probe')).paddingTop)||0)/S;
  office.className=MODE==='tv'?'tv':''; office.style.width=px(W); office.style.height=px(H); office.style.transform=`scale(${S})`;
  if(MODE==='phone'){ const top=safe+36;
    L={stage:{x:4,y:top,w:W-8,h:H-top-8}};
  } else { const top=safe+52;
    L={stage:{x:10,y:top,w:W-20,h:H-top-14}};
  }
  const g=GRID[MODE], rows=g.length, cols=g[0].length, St=L.stage; ZL={};
  // a hallway: vertical down the middle on the phone, horizontal across the middle on the TV
  const HW=MODE==='phone'?30:70;
  const zw=MODE==='phone'?(St.w-HW)/2:St.w/cols, zh=MODE==='phone'?St.h/rows:(St.h-HW)/2;
  L.hall=MODE==='phone'?{v:true,x:St.x+zw+HW/2,a:St.y,b:St.y+St.h,w:HW}:{v:false,y:St.y+zh+HW/2,a:St.x,b:St.x+St.w,w:HW};
  g.forEach((row,ri)=>row.forEach((z,ci)=>{
    const cx=MODE==='phone'?St.x+ci*(zw+HW):St.x+ci*zw, cy=MODE==='phone'?St.y+ri*zh:St.y+ri*(zh+HW);
    const k=Math.min(zw/100,zh/100), hz=zh/k;
    ZL[z]={x:cx+(zw-100*k)/2,y:cy,w:zw,h:zh,k,hz,off:Math.max(0,(hz-96)*.4),cx,ri,ci};}));
  const k=ZL.boss.k; office.style.setProperty('--ch',px(34*k)); office.style.setProperty('--cw',px(34*k*20/26));
  buildStatic();
}
const ZP=(z,u)=>{const Z=ZL[z];return{x:Z.x+u.x*Z.k,y:Z.y+(u.y<0?Z.hz+u.y:u.y+Z.off)*Z.k}};
const pos=p=>({left:px(p.x),top:px(p.y)});

// ---------- who is on stage ----------
const HERO=['podA','standing','reception','board','kiosk','podB','copier'];

const isMer=p=>/^meredith\b/i.test(p.name);
function assign(people){

  const live=people.filter(p=>!p.isBoss&&p!==mer&&p.status!=='asleep'&&!p.waiting).sort((a,b)=>b.lastActivity-a.lastActivity).slice(0,HERO.length);
  const want=new Set(live.map(p=>p.id));
  for(const s of HERO) if(slots[s]&&!want.has(slots[s])) slots[s]=null;
  for(const p of live){ if(Object.values(slots).includes(p.id)) continue;
    const pref=/build|API|launch|shop/i.test(p.title)?['standing']:/assistant|reception/i.test(p.title)?['reception']:[];
    const s=[...pref,...HERO].find(s=>!slots[s]); if(s) slots[s]=p.id; }
  const seated=new Set(Object.values(slots)); const away=people.filter(p=>!p.isBoss&&p!==mer&&p.status==='away'&&!p.waiting&&!seated.has(p.id)).sort((a,b)=>b.lastActivity-a.lastActivity);
  const asleep=people.filter(p=>!p.isBoss&&p!==mer&&p.status==='asleep'&&!p.waiting).sort((a,b)=>b.lastActivity-a.lastActivity);
  brkSet=keepOrder(brkSet,away.slice(0,mer?5:6).map(p=>p.id)); loungeSet=keepOrder(loungeSet,asleep.slice(0,3).map(p=>p.id));
  badge(L.brkBadge,away.length-brkSet.length,''); badge(L.loungeBadge,asleep.length-loungeSet.length,'');
  L.zzz.classList.toggle('show',loungeSet.length>0);
  const waiting=people.filter(p=>p.waiting&&p!==mer).sort((a,b)=>a.name.localeCompare(b.name)).map(p=>p.id);
  const spot={};
  if(boss) spot[boss.id]={...ZP('boss',ZONES.boss.seats.boss),zone:'boss',slot:'boss'};
  for(const s of HERO) if(slots[s]){const z=ZONE_OF[s], u=ZONES[z].seats[s]; spot[slots[s]]={...ZP(z,u),stand:!!u.stand,zone:z,slot:s}}
  const Zb=ZL.brk, ex=Math.max(0,(Zb.x-Zb.cx)/Zb.k-3), wide=u=>({...u,x:-ex+u.x*(100+2*ex)/100}); // use the room's full width

  brkSet.forEach((id,i)=>{const u=ZONES.brk.spots[i+(mer?1:0)]; spot[id]={...ZP('brk',wide(u)),zone:'brk',standing:true,back:!!u.back}});
  loungeSet.forEach((id,i)=>spot[id]={...ZP('lounge',ZONES.lounge.spots[i]),zone:'lounge'});

function doorSpot(i=0){const k=ZL.boss.k, s=16*k; return L.hall.v?{x:L.hall.x+((i%2)?s*.6:-s*.6)*(i?1:0),y:L.door.y-10*k-Math.floor((i+1)/2)*s}:{x:L.door.x+12*k+i*s,y:L.hall.y+6*k}}

  if(L.hall.v){const inX=d.x+(d.side==='right'?-6*k:6*k); return [{x:inX,y:a},{x:L.hall.x,y:a}]}

// ---------- motion ----------
function setPos(o,p,instant){
  const prev=o.pos||p; o.pos={x:p.x,y:p.y};
  if(Math.abs(prev.x-p.x)>3) o.el.classList.toggle('left',p.x<prev.x);

  else o.el.style.transform=`translate(${p.x}px,${p.y}px)`;
}
async function walk(o,p,carry,hl){
  o.dest={x:p.x,y:p.y}; o.el.style.zIndex=''; if(zoneAt(p)!=='brk') o.el.classList.remove('small');
  if(!o.pos){setPos(o,p,true);return}
  if(Math.hypot(p.x-o.pos.x,p.y-o.pos.y)<3) return;
  o.el.classList.add('moving'); o.el.classList.remove('visiting'); setPose(o,''); hideBubble(o); setIcon(o,null);
  let c; if(carry){c=document.createElement('span');c.className='carry';c.textContent=carry;o.el.appendChild(c)}
  hl&&hl.classList.add('on');
  const speed=MODE==='tv'?2.0:4.6; // ms per world unit
  for(const q of route(o.pos,p)){const d=Math.abs(q.x-o.pos.x)+Math.abs(q.y-o.pos.y); if(d<.5) continue;
    const t=Math.max(120,d*speed); o.el.style.transitionDuration=t+'ms'; setPos(o,q); await sleep(t);}

  const w=b.offsetWidth, c=ch(), x=Math.max(4,Math.min(W-w-4,o.pos.x-w/2)); b.style.setProperty('--tail',(o.pos.x-x)+'px'); b.style.transform=`translate(${x}px,${o.pos.y-c*(o.el.classList.contains("small")?1.02:1.26)-b.offsetHeight}px)`;

const HOLD=()=>MODE==='tv'?6000:4500;
let motionBusy=0; const motionMax=()=>MODE==='tv'?2:1;

// ---------- playback of real events (one hero motion at a time on phone, two on TV) ----------
async function play(o,ev){
  if(Date.now()-ev.ts>180000||o.el.classList.contains('off')) return chipPop(o,ev);
  await lock();
  try{
    if(ev.kind==='talking'&&ev.to){
      const t=P[ev.to], inside=t&&t.pos&&!t.el.classList.contains('off'), v=inside?visitSpot(t,o):null;
      inside&&t.el.classList.add('target');
      await walk(o,inside?v:doorSpot(),'✉️',inside?null:L.hlDoor);

  const busy=st.people.filter(p=>p.status==='working'&&act(p)).sort((a,b)=>b.tpm-a.tpm).slice(0,MODE==='tv'?3:2);
  const waiting=st.people.filter(p=>p.waiting), v=l=>l?l.charAt(0).toLowerCase()+l.slice(1):'';
  const parts=[`${c.working} working`,...busy.map(p=>`${p.name}: ${v(act(p).label)}`)]; if(waiting.length) parts.push(`📞 ${waiting.map(p=>p.name).join(', ')} need __OWNER__`);
  const evs=[]; st.people.forEach(p=>p.events.forEach(e=>{if(e.kind!=='saying'&&(e.kind!=='wrapup'||e.ask))evs.push({...e,who:p.name})})); evs.sort((a,b)=>b.ts-a.ts);
  const latest=evs[0], line=e=>esc(e.kind==='talking'&&e.says?`→ ${e.toName}: ${e.says}`:e.label);
  document.getElementById('head').innerHTML=`<div class="h1">${esc(parts.join(' · '))}</div>`;
  const tk=document.getElementById('ticker');
  if(tk) tk.innerHTML=evs.slice(0,4).map(e=>`<div class="tk" style="border-left:8px solid ${CATHEX[e.cat]}"><span class="ago">${ago(e.ts)}</span><span class="who">${esc(e.who)}</span><div class="txt">${line(e)}</div></div>`).join('');
}

// ---------- detail sheet ----------
function screenHTML(p,n){return p.events.slice(-n).reverse().map(e=>`<div class="ln"><span class="t">${ago(e.ts)}</span> <span class="c" style="color:${CATHEX[e.cat]}">${esc(e.label)}</span>\n${esc(e.raw||'')}</div>`).join('')||'<div class="ln">— screen off —</div>'}
function openSheet(refresh){
  const p=P[selected]?.data; if(!p) return;
  sheet.innerHTML=`<h2>${esc(p.title)}</h2><div class="meta"><b style="color:var(--${p.status})">${p.status}</b> · ${p.tpm} actions/min · active ${ago(p.lastActivity)} ago${p.waiting?` · <b>needs __OWNER__:</b> ${esc(p.waiting)}`:''}</div><div class="screen">${screenHTML(p,14)}</div>`;
  if(!refresh) sheet.classList.add('open');
}
office.onclick=()=>{selected=null;sheet.classList.remove('open')};

function tagName(n){if(/in training/i.test(n)) return 'Michael Jr'; const m=String(n).match(/^(\S+)\b.*?(\d+)\s*$/); return m?m[1]+' '+m[2]:String(n).split(/\s/)[0]}
// ---------- main render ----------
function render(st){
  ST=st; renderPile(st.needsOwner); const spot=assign(st.people); const ids=new Set(st.people.map(p=>p.id));
  for(const p of st.people){
    let o=P[p.id];
    if(!o){const e=el('person off',{},office,`<div class="ring"></div><div class="body">${avatar(p)}</div><div class="tag">${esc(tagName(p.name))}</div>`);
      e.onclick=ev=>{ev.stopPropagation();selected=p.id;openSheet()};
      o=P[p.id]={el:e,ib:el('ib'),bubble:el('bubble'),queue:[],seen:0,data:p};}
    o.data=p; o.spot=spot[p.id]||null;
    if(first&&o.spot){setPos(o,o.spot,true); o.el.classList.remove('off');}
    const fresh=p.events.filter(e=>e.ts>o.seen);
    if(fresh.length&&!first){fresh.slice(-2).forEach((e,i)=>setTimeout(()=>workPop(o,e),i*500)); o.el.classList.remove('pulse'); o.el.offsetWidth; o.el.classList.add('pulse');}
    if(fresh.length){o.seen=fresh[fresh.length-1].ts;
      const keep=(first?fresh.filter(e=>Date.now()-e.ts<90000).slice(-1):fresh).filter(e=>e.kind==='talking'&&e.to||e.kind==='hiring'||e.kind==='presenting'||e.milestone);
      o.queue.push(...keep.filter(e=>!(o.repliedTo&&o.repliedTo.has(e.ts)))); if(o.queue.length>3) o.queue.splice(0,o.queue.length-3);}
    if(o.queue.length) runner(o); else settle(o);
  }
  for(const id in P) if(!ids.has(id)){const o=P[id]; delete P[id]; o.chip&&o.chip.remove(); walk(o,doorSpot(),null,L.hlDoor).then(()=>{o.el.remove();o.bubble.remove();o.ib.remove()})}
  renderRoster(st.people,spot); first=false; renderHead(st); daylight(); if(selected) openSheet(true);
}
async function tick(){try{const r=await fetch('/api/state',{cache:'no-store'});render(await r.json())}catch(e){console.error(e)}}
let rt, lastSize=[innerWidth,innerHeight]; addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{
  const tvNow=innerWidth>innerHeight*1.15, tvWas=lastSize[0]>lastSize[1]*1.15;
  if(tvNow===tvWas&&Math.abs(innerWidth-lastSize[0])<40&&Math.abs(innerHeight-lastSize[1])<140) return; // ignore iOS address-bar jiggle
  lastSize=[innerWidth,innerHeight]; computeLayout(); if(ST){first=true;render(ST)}},300)});
computeLayout(); tick(); setInterval(tick,3000);
</script>
</body>
